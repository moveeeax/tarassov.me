name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI only reads the repo; release/builder-cache workflows declare their own
# write scopes explicitly.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pull ghcr builder:cache
    # End-to-end: builds the Docker builder stage (which compiles everything
    # with sanitizers and links the test binary), then runs the full gtest
    # suite against ephemeral Postgres + Redis containers via the `test`
    # compose profile — the same thing `make test` does locally.
    #
    # 60m, not 25m: a fully cold cache (no gha, no GHCR builder:cache) means a
    # full vcpkg dependency build (~24m on 2026-10-08) before our code even
    # compiles; that cold run took 41m30s here. This job must be able to finish
    # that once and export type=gha cache — otherwise it is killed mid-build
    # and every later run stays cold too.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        # A cold builder build (vcpkg debug+release trees, ~1.3GB layer) plus
        # the --load copy into dockerd filled the hosted runner's disk in PR
        # run 41341315737 ("no space left on device"). Drop preinstalled
        # toolchains this job never uses before building.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (pull builder cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build test-runner image (cache warm)
        # Build the test-runner stage HERE via buildx (gha + GHCR cache,
        # ENABLE_WERROR=ON — same layer keys as the builder-cache workflow) and
        # load it under the tag compose expects. Previously `make test` let
        # compose rebuild the stage itself: BuildKit can't use a merely-loaded
        # image as cache (no inline metadata), so every CI run recompiled the
        # whole app a second time (~8 min) inside the test step.
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: test-runner
          push: false
          load: true
          tags: tarassov-me:test-latest
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Run full test suite
        # Run-only targets — compose reuses the tarassov-me:test-latest image
        # loaded above and never rebuilds. test-quick covers unit+integration,
        # test-e2e the HTTP end-to-end binary (mirrors `make test` coverage).
        env:
          # Interpolated into the compose test-runner environment block. Without
          # it every DB/cache-backed suite SKIPs when the sidecars are mis-wired
          # and the job still exits 0 — green with zero integration coverage.
          # See the guard in tests/test_helpers.hpp.
          CI_REQUIRE_INFRA: '1'
        run: |
          make test-quick COMPOSE_BIN="docker compose"
          make test-e2e COMPOSE_BIN="docker compose"

      - name: Dump logs on failure
        if: failure()
        run: |
          docker compose -f docker/docker-compose.yml --env-file docker/.env \
            --profile test logs test-runner || true

  runtime-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pull ghcr builder:cache
    # The images we actually ship. Everything else in CI builds `builder` or
    # `test-runner`, and both the gtest and e2e suites run INSIDE the builder
    # with the full toolchain — so runtime-base's thin ~8-package layer is
    # never exercised until the cluster pulls it. Adding a link-time dependency
    # without mirroring it into runtime-base ships green and CrashLoopBackOffs
    # in prod (that is the recorded ca-certificates/STARTTLS incident). Until
    # this job existed the release workflow's Trivy CVE scan was the only thing
    # that ever looked at these two stages.
    # 60m: on a cold cache this job hit the old 45m limit (run 36538349920).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        # A cold builder build (vcpkg debug+release trees, ~1.3GB layer) plus
        # the --load copy into dockerd filled the hosted runner's disk in PR
        # run 41341315737 ("no space left on device"). Drop preinstalled
        # toolchains this job never uses before building.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (pull builder cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: runtime
          push: false
          load: true
          tags: tarassov-me:runtime-ci
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Build worker runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: worker-runtime
          push: false
          load: true
          tags: tarassov-me-worker:runtime-ci
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Runtime images resolve every shared library
        # ldd exits 0 even when a DT_NEEDED entry is missing, so grep the
        # output. Also assert the CA bundle is present: without it every
        # outbound TLS (SMTP STARTTLS, S3) fails at runtime only.
        run: |
          check_image() {
            image="$1"; binary="$2"
            echo "── $image (/app/$binary)"
            docker run --rm --entrypoint /bin/sh "$image" -c "ldd /app/$binary" | tee ldd.txt
            if grep -q 'not found' ldd.txt; then
              echo "::error::$image: unresolved shared library — runtime-base is missing a package"
              exit 1
            fi
            docker run --rm --entrypoint /bin/sh "$image" -c \
              'test -s /etc/ssl/certs/ca-certificates.crt' || {
              echo "::error::$image: no CA bundle — outbound TLS (SMTP/S3) would fail"
              exit 1
            }
          }
          check_image tarassov-me:runtime-ci tarassov_me
          check_image tarassov-me-worker:runtime-ci tarassov_me_worker

      - name: API runtime binary starts
        # --print-routes returns before any Core init, so no Postgres/Redis is
        # needed and the check still proves the shipped binary loads and runs.
        run: |
          docker run --rm tarassov-me:runtime-ci --print-routes | tee routes.txt
          grep -q '/healthz' routes.txt

      - name: Worker runtime binary starts
        # The worker takes no no-op flag: point it at a config that isn't there
        # so it exits non-zero AFTER the startup banner. The banner is what we
        # assert on — reaching it means the dynamic loader and the static
        # initialisers ran inside the runtime image.
        run: |
          out="$(timeout 120 docker run --rm tarassov-me-worker:runtime-ci config/no-such-config.json 2>&1 || true)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -q 'C++ API Worker Starting'

  lint-format:
    runs-on: ubuntu-latest
    # Pure text lint — doesn't need Docker, runs fast, gates style issues
    # before the heavier build job finishes.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install clang-format 17 + shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-17 shellcheck
          sudo ln -sf /usr/bin/clang-format-17 /usr/local/bin/clang-format

      - name: Check C++ formatting
        run: |
          mapfile -t files < <(find src tests -type f \
            \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' \))
          if [ ${#files[@]} -eq 0 ]; then
            echo "No C++ sources to check"; exit 0
          fi
          clang-format --dry-run --Werror "${files[@]}"

      - name: Shellcheck (scripts + docker)
        # Install via apt and invoke directly rather than a download-based
        # action: the self-hosted ARC runner image ships no `xz`, so the
        # action's shellcheck .tar.xz can't be unpacked (`xz: Cannot exec`).
        # Covers scripts/ and docker/ (the Postgres replica setup scripts).
        run: |
          mapfile -t files < <(find scripts docker -type f -name '*.sh')
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts to check"; exit 0
          fi
          shellcheck --severity=warning "${files[@]}"

  secret-scan:
    runs-on: ubuntu-latest
    # Catch credentials before they land. We learned the hard way that a
    # local helm/values.yaml with stage passwords can slip into git.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # gitleaks needs history to scan past commits.
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  openapi-drift:
    runs-on: ubuntu-latest
    # Pure-shell check — verifies (method, path) tuples in
    # Api::get_endpoints() match docs/openapi.yaml. Runs in seconds, gates
    # the heavier build job from going green if the spec is stale.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check OpenAPI drift
        run: ./scripts/check-openapi-drift.sh
      - name: Check routes registered
        run: ./scripts/check-routes-registered.sh
      - name: Check test-bucket filter sync
        run: ./scripts/check-test-buckets.sh
      - name: Check public-surface sync (CSP x3, nginx blocks, allowlist x4)
        run: ./scripts/check-public-surface-sync.sh
      - name: Check version sync (CMakeLists.txt <-> CHANGELOG)
        # The baked project(VERSION ...) is what /health and / report on every
        # non-tag build; it went three releases stale because nothing compared
        # it to the changelog. Cut a release => bump both in the same commit.
        run: ./scripts/check-version-sync.sh

  helm-charts:
    runs-on: ubuntu-latest
    # Render the tarassov-me-env umbrella with CI values and assert deploy-path
    # invariants (ingress<->service port match, MAIL_VIA_JOBS injected,
    # baseDomain expanded, no null ports). No cluster — pure template smoke
    # test. Catches the helm bug class that compile + unit tests cannot.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install helm + yq
        run: |
          curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          sudo curl -fsSL -o /usr/local/bin/yq https://github.com/mikefarah/yq/releases/download/v4.44.6/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
      - name: Validate helm render
        run: ./scripts/check-helm-render.sh

  frontend:
    runs-on: ubuntu-latest
    # Frontend gate — typecheck + lint + production build. Regenerates
    # schema.gen.ts from docs/openapi.yaml and fails if the committed copy
    # is stale (see the "schema.gen.ts up to date" step).
    timeout-minutes: 10
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Regenerate OpenAPI types
        run: npm run gen:api
      - name: schema.gen.ts up to date with docs/openapi.yaml
        # gen:api just rewrote schema.gen.ts from the spec. If the committed
        # copy differs, someone changed docs/openapi.yaml without running
        # `make frontend-gen-api` — fail so the stale file can't ride green.
        run: git diff --exit-code -- src/lib/api/schema.gen.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Lint
        run: npm run lint  # flat config, zero-warning baseline
      - name: Production build
        run: npm run build

  frontend-image:
    runs-on: ubuntu-latest
    # frontend/Dockerfile (Node builder -> nginx-unprivileged runtime) was built
    # only by release.yml, so a broken COPY or a base-image change surfaced at
    # release time. Build the shipped image here and check that nginx starts.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build frontend runtime image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: frontend/Dockerfile
          target: runtime
          push: false
          load: true
          tags: tarassov-me-frontend:runtime-ci
          cache-from: type=gha,scope=frontend-ci
          cache-to: type=gha,scope=frontend-ci,mode=max

      - name: nginx starts and serves /healthz
        # nginx.conf proxies to http://app:8080 and resolves that name at
        # startup; map it to loopback so the config loads without the API.
        run: |
          docker run -d --name fe --add-host app:127.0.0.1 -p 8080:8080 tarassov-me-frontend:runtime-ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/healthz; then echo; exit 0; fi
            sleep 1
          done
          docker logs fe
          exit 1

  clang-tidy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pull ghcr builder:cache
    # No needs-chain: on GitHub-hosted runners each job gets its own VM, so the
    # heavy builds can run in parallel (the old ARC runners OOM'd on two
    # concurrent builds — that constraint is gone). The builder layers come from
    # the gha/GHCR caches either way.
    # Structural and API-usage lint. Uses the builder image for
    # compile_commands.json so the analysis sees the real include paths
    # vcpkg resolved. Best-effort: warnings don't gate yet, the .clang-tidy
    # baseline is still being tightened.
    # 60m: same cold-cache budget as build-and-test. At 25m the builder stage
    # alone overran (vcpkg install took 1419s in run 37862089573), so a cold
    # cache made every main push red.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        # A cold builder build (vcpkg debug+release trees, ~1.3GB layer) plus
        # the --load copy into dockerd filled the hosted runner's disk in PR
        # run 41341315737 ("no space left on device"). Drop preinstalled
        # toolchains this job never uses before building.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (pull builder cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: tarassov-me-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Run clang-tidy inside builder
        # continue-on-error: ratchet — flip to false once baseline is clean.
        # Checks come from .clang-tidy in the repo root (mounted read-only).
        # GitLab CI counterpart previously had -checks=-* (disabled ALL checks);
        # that flag is now removed there too. Both jobs now use the .clang-tidy
        # config (bugprone-*, performance-*, portability-*, clang-analyzer-*).
        continue-on-error: true  # TODO: flip to false once baseline is clean
        run: |
          docker run --rm \
              -v "$PWD":/src \
              -v "$PWD/.clang-tidy":/app/.clang-tidy:ro \
              --entrypoint /bin/bash \
              tarassov-me-template:builder -c "
                  apt-get update -qq && apt-get install -y -qq clang-tidy >/dev/null && \
                  run-clang-tidy -p /app/build -quiet -header-filter='src/.*' /app/src/ \
                      | tee /src/clang-tidy.log
              "

      - name: Upload clang-tidy log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clang-tidy-log
          path: clang-tidy.log
          if-no-files-found: ignore

  sanitizers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read  # pull ghcr builder:cache
    # AddressSanitizer + UndefinedBehaviorSanitizer over the unit-test bucket.
    # Integration tests need real Postgres/Redis which aren't wired into this
    # job — keep them out of the filter. Allows a separate, fast feedback
    # signal for memory/UB regressions.
    # 60m: see clang-tidy — the cold builder stage alone exceeds 25m.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        # A cold builder build (vcpkg debug+release trees, ~1.3GB layer) plus
        # the --load copy into dockerd filled the hosted runner's disk in PR
        # run 41341315737 ("no space left on device"). Drop preinstalled
        # toolchains this job never uses before building.
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR (pull builder cache)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build builder image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: false
          load: true
          tags: tarassov-me-template:builder
          build-args: ENABLE_WERROR=ON
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=gha,mode=max

      - name: Build & run unit tests with ASan + UBSan
        run: |
          docker run --rm \
              --entrypoint /bin/bash \
              tarassov-me-template:builder -c "
                  set -e
                  cd /app
                  rm -rf build-san
                  cmake -B build-san \
                      -G Ninja \
                      -DCMAKE_BUILD_TYPE=Debug \
                      -DENABLE_SANITIZERS=ON \
                      -DCMAKE_TOOLCHAIN_FILE=/opt/vcpkg/scripts/buildsystems/vcpkg.cmake \
                      -DVCPKG_INSTALLED_DIR=/app/vcpkg_installed  # reuse the builder stage's vcpkg tree (mirrors the sanitizer-builder Dockerfile stage); avoids a full vcpkg reinstall
                  cmake --build build-san -j\$(nproc) --target tarassov_me_tests_unit
                  ASAN_OPTIONS=halt_on_error=1:detect_leaks=1 \
                  UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
                  ./build-san/tarassov_me_tests_unit \
                      --gtest_color=yes
              "
