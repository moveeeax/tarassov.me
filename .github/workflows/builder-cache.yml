# Publishes the dependency-heavy `builder` stage to GHCR whenever the
# dependency set changes. Local developers then run `make warm-cache` to
# prime their docker build cache and skip the ~30-minute cold vcpkg build.
name: builder-cache

on:
  push:
    branches: [main]  # was [master] — the repo's default branch is main, so this never fired
    paths:
      - vcpkg.json
      - docker/Dockerfile
  # ubuntu:24.04 is not pinned by digest, so every upstream re-publish of the
  # base image changes the first layer and invalidates the whole cached
  # builder stage. Path-triggered pushes alone left builder:cache stale from
  # 2026-09-17 on, and CI on main ran fully cold until it timed out. A weekly
  # rebuild keeps the GHCR cache on the current base image.
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish-builder-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push builder stage with inline cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          push: true
          tags: ghcr.io/${{ github.repository }}/builder:cache
          build-args: |
            BUILDKIT_INLINE_CACHE=1
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}/builder:cache
          cache-to: type=inline
