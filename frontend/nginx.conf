# Single entry point for the stack:
#   /                      → public BookCard static site (index.html vCard + blog)
#   /login /account/* /admin/* … → React SPA fallback (app.html)
#   /assets/*              → hashed Vite chunks
#   /api/*                → proxied to the backend (app:8080), same-origin cookies
#
# The frontend container serves the static bundles and forwards /api/* to the
# backend container, so cookies stay first-party (SameSite=Lax keeps them on).
#
# NOTE: nginx `add_header` does NOT inherit into a location that sets its own,
# so the security headers are repeated in the content location rather than
# declared once at server level.

server {
    # 8080: unprivileged port so the nginx master can run as a non-root user
    # (the image is built FROM nginxinc/nginx-unprivileged).
    listen       8080;
    server_name  _;

    root /usr/share/nginx/html;
    index index.html;

    # Redirects must never leak this pod's listen port: nginx's automatic
    # "/blog → /blog/" 301 for a proxied prefix location produced
    # http://<host>:8080/blog/ through the TLS ingress. Relative Locations
    # keep the browser on the original origin.
    absolute_redirect off;

    # Liveness for the docker-compose / k8s healthcheck.
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }

    # Long cache for hashed Vite assets (the React build emits /assets/*).
    location ^~ /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # React app routes (auth/account/admin) → SPA fallback with a STRICT CSP:
    # the Vite bundle has no inline JS, so script-src stays 'self' (no
    # 'unsafe-inline'). Matched ahead of `location /` (regex beats prefix), so
    # the admin never inherits the relaxed public-site policy. A new top-level
    # React route must be added here to get the strict policy (otherwise it
    # falls through to `location /` and still works, just less strict).
    location ~ ^/(admin|login|register|account|unconfirmed|about)(/|$) {
        try_files $uri /app.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Everything else: serve a real file if present — the BookCard vCard
    # (index.html), blog pages, and its /css /js /images — otherwise fall back
    # to the React SPA (app.html). The public template ships inline JS so this
    # policy keeps script-src 'unsafe-inline' (admin paths above stay strict).
    location / {
        try_files $uri $uri/ /app.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # Server-rendered SEO pages (dynamic, from the DB): the sitemap and clean
    # per-post URLs with a real per-post <head>. Proxied to the backend like
    # /api/. KEEP IN SYNC with helm/tarassov-me-frontend/templates/configmap.yaml
    # (prod overrides this file).
    location = /sitemap.xml {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }
    # /blog and /blog/ are not pages — the index lives at /blog.html. Exact
    # locations beat the ^~ prefix below AND suppress nginx's automatic
    # trailing-slash 301 for the proxied prefix (the :8080 leak).
    location = /blog  { return 301 /blog.html; }
    location = /blog/ { return 301 /blog.html; }

    # Clean per-post URLs. `^~` so /blog.html (the static index) is NOT matched
    # here — only /blog/<slug> reaches the backend. Public-site CSP (the page
    # loads /js/blog.js and an inline JSON-LD script).
    location ^~ /blog/ {
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        # The backend stamps an API-grade CSP (default-src 'none') via its
        # security middleware; browsers INTERSECT multiple CSP headers, so
        # letting it through bricks the page (no JS/CSS). Hide it — the
        # public-site policy is added below.
        proxy_hide_header Content-Security-Policy;
        proxy_connect_timeout 5s;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    }

    # API proxy. `app` is the docker-compose service name; same network shared.
    location /api/ {
        # Media uploads accept up to 5 MB (UploadController kMaxBytes); the
        # nginx default is 1m, which 413s a normal photo before it reaches the
        # backend. 6m leaves headroom for multipart overhead. (Behind the prod
        # ingress, also set nginx.ingress.kubernetes.io/proxy-body-size.)
        client_max_body_size 6m;
        proxy_pass http://app:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }
}
